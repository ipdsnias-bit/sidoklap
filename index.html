<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a148c">
<meta name="description" content="SiDokLap - Sistem Dokumentasi Lapangan">
<title>SiDokLap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%234a148c'/%3E%3Cpath fill='%23fff' d='M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 4 7.6 5.5H5.5C4.7 5.5 4 6.2 4 7v10c0 .8.7 1.5 1.5 1.5h13c.8 0 1.5-.7 1.5-1.5V7c0-.8-.7-1.5-1.5-1.5h-2.1L15 4H9zm3 12.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #4a148c; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #f4f0f9; }
  #muat { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: #4a148c; color: #fff; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; transition: opacity .3s; }
  #muat.selesai { opacity: 0; pointer-events: none; }
  #muat b { font-size: 26px; }
  .putar { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: p .8s linear infinite; }
  @keyframes p { to { transform: rotate(360deg); } }
  #cadangan { display: none; font-size: 13.5px; opacity: .9; }
  #cadangan a { color: #fff; font-weight: 600; }
</style>
</head>
<body>
<!-- Ganti alamat di bawah bila URL /exec aplikasi berubah. -->
<iframe id="app" title="SiDokLap"
  src="https://script.google.com/macros/s/AKfycbzvympTJGr-D9f9qLt0IeTtJ59oJh1JtVIdd2xb_ohqdInFHcvxZMm4R3IxdfvA5RUriA/exec"
  allow="camera *; geolocation *; clipboard-write *; fullscreen *"></iframe>
<div id="muat">
  <div class="putar"></div>
  <b>SiDokLap</b>
  <div>Sistem Dokumentasi Lapangan</div>
  <div id="cadangan">Aplikasi belum terbuka?<br><a id="langsung" href="#" target="_top">Buka aplikasi langsung</a></div>
</div>
<noscript><p style="color:#fff;text-align:center">Aktifkan JavaScript untuk membuka SiDokLap.</p></noscript>
<script>
  var app = document.getElementById('app');
  document.getElementById('langsung').href = app.src;
  app.addEventListener('load', function () { document.getElementById('muat').className = 'selesai'; });
  // Bila koneksi lambat atau aplikasi gagal dimuat, tampilkan tautan untuk membukanya langsung.
  setTimeout(function () { document.getElementById('cadangan').style.display = 'block'; }, 12000);
</script>
</body>
</html>
